<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ranura · Consola</title>
<meta name="theme-color" content="#170f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Layout: one loading card in Ranura's arcade style, then the emulator takes the whole screen. */
:root {
  --night: #170f2e; --panel: #1d1444; --line: #0b0616; --lilac: #b89cff; --pink: #ff5fb0; --lime: #c8ff4d;
  --ink: #fbf8ff; --ink-2: #d2c5f5;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(rgba(184,156,255,.065) 2px, transparent 2px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(184,156,255,.065) 2px, transparent 2px) 0 0 / 28px 28px, var(--night);
  color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%;
}
main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
.card { width: min(520px, 100%); display: grid; gap: 12px; padding: 26px 22px 22px; background: var(--panel); border: 3px solid var(--line); border-radius: 8px; box-shadow: inset 0 0 0 3px var(--lilac), inset 0 0 0 6px var(--panel), 5px 5px 0 var(--line); position: relative; }
.tag { position: absolute; top: -13px; left: 14px; font: 700 11px var(--mono); letter-spacing: .08em; background: var(--pink); color: var(--line); border: 3px solid var(--line); padding: 4px 8px; transform: rotate(-2deg); }
h1 { margin: 0; font: 700 22px/1.2 var(--mono); overflow-wrap: anywhere; }
p { margin: 0; color: var(--ink-2); }
#msg[data-tone="error"] { color: #ffb0d6; }
.bar { height: 10px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 34%; background: var(--lime); animation: load 1.1s steps(7, jump-none) infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.back { justify-self: start; color: var(--lime); font-weight: 700; text-decoration: none; border: 2px solid var(--line); background: #33246a; padding: 8px 12px; border-radius: 4px; box-shadow: 2px 2px 0 var(--line); }
/* Play screen. Portrait: bar, picture, then Ranura's own touch pad below it. Landscape: picture full
   screen with the pad over its edges. Everything stays inside the safe area (island, home bar). */
#stage { position: fixed; inset: 0; z-index: 10; background: var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#topbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 6px 8px; min-height: 40px; }
#topbar button { border: 2px solid var(--line); border-radius: 4px; padding: 5px 10px; background: #33246a; color: var(--ink); font: 700 13px var(--mono); box-shadow: 2px 2px 0 var(--line); }
#topbar button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#ver { font: 10px var(--mono); color: #8d80b8; }
#screen { display: grid; place-items: center; background: #000; min-height: 0; }
#game { width: 100%; height: 100%; }
#stage.pad-on { grid-template-rows: auto auto minmax(0, 1fr); }
#stage.pad-on #game { width: min(100%, calc(50dvh * var(--arn, 1.333))); height: auto; aspect-ratio: var(--ar, 4 / 3); }
#stage.pad-on .ejs_virtualGamepad_parent { display: none !important; }
#pad { --u: clamp(42px, 12.5vw, 56px); display: grid; grid-template: "left right" minmax(0, 1fr) "mid mid" auto / 1fr 1fr; align-items: center; gap: 8px; padding: 10px 14px 12px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.side { display: grid; gap: calc(var(--u) * .22); justify-items: center; align-content: center; }
.side.left { grid-area: left; justify-self: start; }
.side.right { grid-area: right; justify-self: end; }
.side.left .sh { justify-self: start; }
.side.right .sh { justify-self: end; }
.mid { grid-area: mid; justify-self: center; display: flex; gap: 14px; }
.sh { display: flex; gap: 8px; }
.k { display: grid; place-items: center; width: var(--u); height: var(--u); border: 3px solid var(--line); border-radius: 50%; background: var(--lilac); color: var(--line); font: 700 calc(var(--u) * .36)/1 var(--mono); box-shadow: 0 4px 0 #05020c; }
.k.on { transform: translateY(4px); box-shadow: none; background: var(--lime); }
.k.w { width: calc(var(--u) * 1.35); height: calc(var(--u) * .7); border-radius: 6px; font-size: calc(var(--u) * .3); background: #33246a; color: var(--ink); }
.k.s { width: auto; min-width: calc(var(--u) * 1.3); height: calc(var(--u) * .56); padding: 0 10px; border-radius: 999px; font-size: 11px; letter-spacing: .06em; background: #33246a; color: var(--ink-2); }
.k.c { width: calc(var(--u) * .72); height: calc(var(--u) * .72); font-size: calc(var(--u) * .26); }
.cpad .k.c { background: #ffd84d; }
.k.w.on, .k.s.on, .cpad .k.c.on { background: var(--lime); color: var(--line); }
.dia { display: grid; grid-template: repeat(3, auto) / repeat(3, auto); place-items: center; }
.dia > :nth-child(1) { grid-area: 1 / 2; }
.dia > :nth-child(2) { grid-area: 2 / 1; }
.dia > :nth-child(3) { grid-area: 2 / 3; }
.dia > :nth-child(4) { grid-area: 3 / 2; }
.pair { display: flex; align-items: flex-end; gap: calc(var(--u) * .28); }
.pair > :last-child { margin-bottom: calc(var(--u) * .5); }
.rows { display: grid; gap: 8px; }
.rows > div { display: flex; gap: 8px; justify-content: center; align-items: center; }
.dp { position: relative; width: calc(var(--u) * 2.5); height: calc(var(--u) * 2.5); }
.both .dp { width: calc(var(--u) * 2); height: calc(var(--u) * 2); }
.dp b { position: absolute; width: 34%; height: 34%; background: #33246a; border: 3px solid var(--line); }
.dp .u { left: 33%; top: 0; border-bottom: 0; border-radius: 6px 6px 0 0; }
.dp .d { left: 33%; bottom: 0; border-top: 0; border-radius: 0 0 6px 6px; }
.dp .l { left: 0; top: 33%; border-right: 0; border-radius: 6px 0 0 6px; }
.dp .r { right: 0; top: 33%; border-left: 0; border-radius: 0 6px 6px 0; }
.dp::after { content: ""; position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; background: #33246a; }
.dp b.on { background: var(--lime); }
.st { position: relative; width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); border: 3px solid var(--line); border-radius: 50%; background: #241a52; box-shadow: inset 0 0 0 3px #33246a; }
.st i { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border: 3px solid var(--line); border-radius: 50%; background: var(--lilac); box-shadow: 0 3px 0 #05020c; }
#soundHint { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 44px); padding: 4px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--pink); color: var(--line); font: 700 11px var(--mono); white-space: nowrap; pointer-events: none; }
#info { position: absolute; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 46px); left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); max-height: 62%; overflow: hidden; margin: 0; padding: 10px 12px;
  background: rgba(11, 6, 22, .93); border: 2px solid var(--lilac); border-radius: 6px; box-shadow: 4px 4px 0 var(--line); font: 11px/1.5 var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none; }
.diag { font: 11px/1.5 var(--mono); color: #a99ad6; overflow-wrap: anywhere; }
.card .retry { justify-self: start; font: 700 14px var(--font); border: 2px solid var(--line); border-radius: 4px; padding: 9px 12px; background: var(--lime); color: var(--line); box-shadow: 2px 2px 0 var(--line); }
@media (orientation: landscape) {
  #stage.pad-on { display: block; padding: 0; }
  #stage.pad-on #topbar { position: absolute; z-index: 3; top: max(2px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); flex-wrap: nowrap; padding: 2px; min-height: 0; opacity: .88; }
  #stage.pad-on #topbar button { padding: 3px 8px; font-size: 12px; white-space: nowrap; }
  #stage.pad-on #screen { position: absolute; inset: 0; }
  #stage.pad-on #game { width: 100%; height: 100%; aspect-ratio: auto; }
  #pad { --u: clamp(34px, 11.5vh, 50px); position: absolute; inset: 0; z-index: 2; pointer-events: none;
    grid-template: "left mid right" minmax(0, 1fr) / auto 1fr auto; align-items: end;
    padding: 34px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  #pad .side, #pad .mid { pointer-events: auto; }
  #pad .k, #pad .dp, #pad .st { opacity: .8; }
  #pad .mid { align-self: end; }
}
/* shown over the game when the engine stops */
#crash { position: fixed; z-index: 30; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(460px, calc(100% - 24px)); display: grid; gap: 10px; padding: 20px 16px 14px; background: var(--panel); border: 3px solid var(--line); border-radius: 8px; box-shadow: inset 0 0 0 3px var(--pink), inset 0 0 0 6px var(--panel), 5px 5px 0 var(--line); }
#crash h2 { margin: 0; font: 700 17px/1.2 var(--mono); }
#crash p { font-size: 14px; }
#crash .diag { font-size: 10.5px; max-height: 13.5em; overflow: hidden; }
#crash .row { display: flex; flex-wrap: wrap; gap: 8px; }
#crash button, #crash a { font: 700 14px var(--font); border: 2px solid var(--line); border-radius: 4px; padding: 9px 12px; box-shadow: 2px 2px 0 var(--line); text-decoration: none; cursor: pointer; }
#crash button { background: var(--lime); color: var(--line); }
#crash a { background: #33246a; color: var(--ink); }
#crash button:focus-visible, #crash a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
<main id="home">
  <div class="card">
    <span class="tag" id="sysTag">CONSOLA</span>
    <h1 id="gameName">Cargando…</h1>
    <div class="bar" id="bar"><i></i></div>
    <p id="msg" role="status" aria-live="polite">Buscando el juego en tu estante…</p>
    <p id="diag" class="diag" hidden></p>
    <button id="retry" class="retry" type="button" hidden>Intentar de nuevo</button>
    <a class="back" href="./">← Volver al estante</a>
  </div>
</main>
<div id="stage" hidden>
  <div id="topbar">
    <button id="closeGame" type="button" hidden>← Salir</button>
    <button id="menuBtn" type="button" hidden>≡ Menú</button>
    <button id="engineBtn" type="button" hidden></button>
    <button id="infoBtn" type="button" hidden aria-label="Diagnóstico">i</button>
    <span id="ver"></span>
  </div>
  <pre id="info" hidden></pre>
  <div id="soundHint" hidden>Sin sonido todavía: toca cualquier botón</div>
  <div id="screen"><div id="game"></div></div>
  <div id="pad" hidden></div>
</div>
<div id="crash" role="alert" hidden>
  <span class="tag">MOTOR DETENIDO</span>
  <h2 id="crashTitle">El motor se detuvo</h2>
  <p id="crashText"></p>
  <p id="crashDiag" class="diag"></p>
  <div class="row">
    <button id="crashSwap" type="button" hidden>Probar el otro motor</button>
    <a href="./">Volver al estante</a>
  </div>
</div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const BUILD = '1125-1715';
  // Performance meter. The engine advances the game from requestAnimationFrame: timing those calls tells how
  // long each turn takes and how much of the time the page is busy. The sound it hands to the browser tells its
  // real speed: one second of sound per second means the game runs at full speed.
  const perf = { turns: 0, busy: 0, max: 0, sound: 0, since: performance.now(), last: null };
  const realFrame = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = (callback) => realFrame((time) => {
    const began = performance.now();
    try { return callback(time); } finally {
      const took = performance.now() - began;
      if (took > 0.25) { perf.turns++; perf.busy += took; if (took > perf.max) perf.max = took; }
    }
  });
  try {
    const startSource = AudioBufferSourceNode.prototype.start;
    AudioBufferSourceNode.prototype.start = function (...args) { try { if (this.buffer) perf.sound += this.buffer.duration; } catch {} return startSource.apply(this, args); };
  } catch {}
  const perfSample = () => {
    const now = performance.now(), seconds = (now - perf.since) / 1000;
    if (seconds < 0.5) return perf.last;
    perf.last = { turns: Math.round(perf.turns / seconds), ms: perf.turns ? Math.round(perf.busy / perf.turns * 10) / 10 : 0, max: Math.round(perf.max), busy: Math.round(perf.busy / (seconds * 10)), speed: Math.round(perf.sound / seconds * 100) };
    perf.turns = 0; perf.busy = 0; perf.max = 0; perf.sound = 0; perf.since = now;
    return perf.last;
  };
  window.__perf = () => perf.last;
  // A game opened from the shelf starts without a tap on this page, so the browser creates the engine's
  // audio suspended. Any tap, on the pad or anywhere, wakes it (touchend/click count as a user gesture).
  const audioContexts = [];
  for (const name of ['AudioContext', 'webkitAudioContext']) {
    const Original = window[name];
    if (typeof Original !== 'function') continue;
    window[name] = class extends Original { constructor(...args) { super(...args); audioContexts.push(this); } };
  }
  const silent = () => audioContexts.some((c) => c.state !== 'running' && c.state !== 'closed'); // suspended, or iOS's "interrupted"
  const wakeAudio = () => { for (const c of audioContexts) if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); };
  for (const type of ['touchend', 'pointerup', 'click', 'keydown']) window.addEventListener(type, wakeAudio, true);
  const TRAIL = 'ranura:rastro';
  let run = null; // this run's trail (see below); null until the game is known
  const saveRun = () => { if (run) try { localStorage.setItem(TRAIL, JSON.stringify(run)); } catch {} };
  const step = (text) => { if (!run) return; run.steps.push(text); run.alive = Date.now(); saveRun(); };
  const leaveClean = () => { if (run) { run.clean = true; saveRun(); } };
  window.addEventListener('pagehide', leaveClean);
  // The engine reports what it is doing through the console. While a game starts, its last lines go into
  // the trail too (written at once: a page that is killed gets no later chance).
  const logTail = [];
  let logOn = true, logSaved = 0;
  for (const kind of ['log', 'warn', 'error']) {
    const original = console[kind].bind(console);
    console[kind] = (...args) => {
      original(...args);
      const line = String(args[0]).replace(/\s+/g, ' ').trim();
      if (line.length < 6) return;
      logTail.push(line.slice(0, 100));
      if (logTail.length > 8) logTail.shift();
      if (!run || !logOn) return;
      run.info.log = logTail.slice(-5);
      run.alive = Date.now();
      if (run.alive - logSaved > 120) { logSaved = run.alive; saveRun(); } // a burst of lines is written once; every step still saves at once
    };
  }
  document.addEventListener('visibilitychange', () => { if (run) { run.clean = document.hidden; run.alive = Date.now(); saveRun(); } });
  // EmulatorJS's settings menu assumes the browser can record video; without this a browser that cannot
  // (some WebKit builds) would fail to start any game.
  if (!('MediaRecorder' in window)) window.MediaRecorder = class { static isTypeSupported() { return false; } };
  const fail = (text) => {
    $('msg').textContent = text; $('msg').dataset.tone = 'error'; $('bar').hidden = true;
    $('home').hidden = false; $('stage').hidden = true; // also when the game screen was already up
  };
  // EmulatorJS system for each of Ranura's consoles. Only PSP needs threads (and so an isolated page).
  const SYSTEMS = {
    NES: { core: 'nes', label: 'NES', color: '#e0483e' },
    SNES: { core: 'snes', label: 'SNES', color: '#8f6fe8' },
    MD: { core: 'segaMD', label: 'MEGA DRIVE', color: '#3b6cf5' },
    N64: { core: 'n64', label: 'N64', color: '#2fae5b' },
    NDS: { core: 'nds', label: 'DS', color: '#9aa0b5' },
    PS1: { core: 'psx', label: 'PS1', color: '#8f93a8' },
    PSP: { core: 'psp', label: 'PSP', color: '#8f6fe8', threads: true },
  };
  $('closeGame').addEventListener('click', () => { leaveClean(); location.href = './'; });
  $('ver').textContent = 'v' + BUILD;

  const id = /^[a-z0-9]+$/i.test(location.hash.slice(1)) ? location.hash.slice(1) : '';
  if (!id) { fail('No se indicó ningún juego. Ábrelo desde tu estante.'); return; }
  let meta = null;
  let blob = null;
  try {
    const db = await new Promise((res, rej) => { const r = indexedDB.open('ranura'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (db.objectStoreNames.contains('roms') && db.objectStoreNames.contains('meta')) {
      const get = (store) => new Promise((res, rej) => { const g = db.transaction(store).objectStore(store).get(id); g.onsuccess = () => res(g.result); g.onerror = () => rej(g.error); });
      meta = await get('meta');
      blob = await get('roms');
    }
  } catch {}
  if (!meta || !(blob instanceof Blob)) { fail('Ese juego ya no está en el estante. Vuelve e insértalo de nuevo.'); return; }
  const sys = SYSTEMS[meta.system];
  if (!sys) { fail('Ranura no tiene un motor para esa consola.'); return; }

  // iOS closes a page that asks for too much (memory, mostly) without telling it, and then reloads it.
  // So each step is written down as it happens. If the page comes back right after dying, it shows where
  // the last run stopped instead of walking into the same wall again.
  let last = null;
  try { last = JSON.parse(localStorage.getItem(TRAIL) || 'null'); } catch {}
  run = { id, build: BUILD, alive: Date.now(), steps: [], clean: false, info: {} };
  let retried = false;
  try { retried = sessionStorage.getItem('ranura-reintento') === id; sessionStorage.removeItem('ranura-reintento'); } catch {}
  if (last && last.id === id && !last.clean && !retried && Date.now() - last.alive < 45000 && Array.isArray(last.steps)) {
    const where = last.steps[last.steps.length - 1] || 'el inicio';
    const i = last.info || {};
    $('sysTag').textContent = sys.label;
    $('gameName').textContent = 'La página se cerró sola';
    $('bar').hidden = true;
    $('msg').dataset.tone = 'error';
    $('msg').textContent = `El navegador cerró la página con «${meta.name}». Último paso: ${where}.`
      + (meta.system === 'PSP' ? ' Si se repite, este juego no cabe en el motor web del iPhone: usa PPSSPP de la App Store con el mismo archivo.' : ' Si se repite, este juego supera lo que el motor web puede hacer en este teléfono.');
    $('diag').hidden = false;
    $('diag').textContent = [`v${last.build}`, `pasos: ${last.steps.join(' › ')}`, i.lazy ? `por partes: ${i.lazy}, ${i.reads || 0} lecturas, ${i.mb || 0} MB` : 'por partes: no', i.core ? `motor: ${i.core}` : '', i.mem ? `memoria del motor: ${i.mem} MB` : '', i.frames ? `cuadros: ${i.frames}` : '', Array.isArray(i.log) && i.log.length ? `registro del motor: ${i.log.join(' | ')}` : ''].filter(Boolean).join(' · ');
    $('retry').hidden = false;
    $('retry').onclick = () => { try { sessionStorage.setItem('ranura-reintento', id); localStorage.removeItem(TRAIL); } catch {} location.reload(); };
    try { localStorage.removeItem(TRAIL); } catch {}
    run = null;
    return;
  }
  step(`${meta.system}, ${Math.round(blob.size / 1048576)} MB`);
  const logKey = 'ranura:registro:' + id;
  let detailedLog = false;
  try { detailedLog = localStorage.getItem(logKey) === '1' || new URLSearchParams(location.search).get('log') === '1'; } catch {}
  if (last && last.id === id && !last.clean) { detailedLog = true; try { localStorage.setItem(logKey, '1'); } catch {} } // it died last time
  run.info.log0 = detailedLog ? 'detallado' : 'apagado';
  // Nintendo 64 has two engines. EmulatorJS picks one by browser (ParaLLEl on iPhone Safari, Mupen64Plus
  // elsewhere); the player's own choice for a game, made from the notice below, wins over that.
  const ENGINES = { N64: { mupen64plus_next: 'Mupen64Plus', parallel_n64: 'ParaLLEl' } };
  const engines = ENGINES[meta.system] || null;
  const engineKey = 'ranura:motor:' + id;
  let chosen = '';
  try { chosen = localStorage.getItem(engineKey) || ''; } catch {}
  if (!engines || !engines[chosen]) chosen = '';
  // ParaLLEl (EmulatorJS's pick for iPhone Safari) showed a black picture on the real iPhone and in WebKit
  // tests, while Mupen64Plus draws: so Mupen64Plus is the default everywhere and ParaLLEl the alternative.
  const engine = engines ? (chosen || 'mupen64plus_next') : sys.core;
  $('sysTag').textContent = sys.label;
  $('gameName').textContent = meta.name;
  document.title = `${meta.name} · Ranura`;

  if (sys.threads && !window.crossOriginIsolated) {
    // Threads need SharedArrayBuffer, which browsers only give to isolated pages. Ranura's service
    // worker adds the isolation headers to this page; the first visit reloads once so it takes control.
    let tried = false;
    try { tried = sessionStorage.getItem('ranura-coi') === '1'; } catch {}
    if (!tried && 'serviceWorker' in navigator && isSecureContext) {
      try { sessionStorage.setItem('ranura-coi', '1'); } catch {}
      $('msg').textContent = 'Preparando el motor…';
      try { await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; location.reload(); return; } catch {}
    }
    fail('Este navegador no permite los hilos que necesita el motor de PSP. Usa PPSSPP de la App Store.');
    return;
  }
  try { sessionStorage.removeItem('ranura-coi'); } catch {}
  let webgl2 = false;

  const pad = $('pad');
  if (layout && touchDevice) {
    const k = ([label, i], cls = '') => `<div class="k ${cls}" data-i="${i}">${label}</div>`;
    pad.innerHTML = `
      <div class="side left${layout.stick ? ' both' : ''}">
        ${layout.sl ? `<div class="sh">${layout.sl.map((b) => k(b, 'w')).join('')}</div>` : ''}
        ${layout.stick ? '<div class="st"><i></i></div>' : ''}
        <div class="dp"><b class="u" data-d="4"></b><b class="l" data-d="6"></b><b class="r" data-d="7"></b><b class="d" data-d="5"></b></div>
      </div>
      <div class="mid">${layout.mid.map((b) => k(b, 's')).join('')}</div>
      <div class="side right">
        ${layout.sr ? `<div class="sh">${layout.sr.map((b) => k(b, 'w')).join('')}</div>` : ''}
        ${layout.c ? `<div class="dia cpad">${layout.c.map((b) => k(b, 'c')).join('')}</div>` : ''}
        ${layout.dia ? `<div class="dia">${layout.dia.map((b) => k(b)).join('')}</div>` : ''}
        ${layout.pair ? `<div class="pair">${layout.pair.map((b) => k(b)).join('')}</div>` : ''}
        ${layout.rows ? `<div class="rows">${layout.rows.map((row, n) => `<div>${row.map((b) => k(b, n === 0 ? 'c' : '')).join('')}</div>`).join('')}</div>` : ''}
      </div>`;
    $('stage').style.setProperty('--ar', `${layout.ratio[0]} / ${layout.ratio[1]}`);
    $('stage').style.setProperty('--arn', String(layout.ratio[0] / layout.ratio[1]));
    $('stage').classList.add('pad-on');
    pad.hidden = false;

    const send = (i, v) => { try { window.EJS_emulator.gameManager.simulateInput(0, i, v); } catch {} };
    const held = new Map(); // finger -> the buttons under it right now
    let down = new Set();
    const padLog = (window.__pad = { sent: [] }); // for the tests
    const refresh = () => {
      const now = new Set();
      for (const set of held.values()) for (const i of set) now.add(i);
      for (const i of now) if (!down.has(i)) { send(i, 1); padLog.sent.push('+' + i); }
      for (const i of down) if (!now.has(i)) { send(i, 0); padLog.sent.push('-' + i); }
      down = now;
      if (padLog.sent.length > 200) padLog.sent.splice(0, 100);
      for (const el of pad.querySelectorAll('.k')) el.classList.toggle('on', now.has(Number(el.dataset.i)));
      for (const el of pad.querySelectorAll('.dp b')) el.classList.toggle('on', now.has(Number(el.dataset.d)));
    };
    // the d-pad is one control: the direction comes from where the finger is around its centre (8 ways)
    const dpadAt = (el, x, y) => {
      const r = el.getBoundingClientRect();
      const dx = (x - r.left) / r.width - 0.5, dy = (y - r.top) / r.height - 0.5;
      const set = new Set();
      if (Math.hypot(dx, dy) < 0.1) return set;
      const a = Math.atan2(dy, dx) * 180 / Math.PI; // 0 right, 90 down
      if (a > -67.5 && a < 67.5) set.add(7);
      if (a > 22.5 && a < 157.5) set.add(5);
      if (a > 112.5 || a < -112.5) set.add(6);
      if (a > -157.5 && a < -22.5) set.add(4);
      return set;
    };
    const stick = pad.querySelector('.st');
    let stickFinger = null;
    const moveStick = (x, y) => {
      const r = stick.getBoundingClientRect();
      let vx = (x - (r.left + r.width / 2)) / (r.width / 2), vy = (y - (r.top + r.height / 2)) / (r.height / 2);
      const m = Math.hypot(vx, vy);
      if (m > 1) { vx /= m; vy /= m; }
      stick.firstElementChild.style.transform = `translate(${vx * 50}%, ${vy * 50}%)`;
      const A = 0x7fff;
      send(16, vx > 0 ? Math.round(vx * A) : 0); send(17, vx < 0 ? Math.round(-vx * A) : 0);
      send(18, vy > 0 ? Math.round(vy * A) : 0); send(19, vy < 0 ? Math.round(-vy * A) : 0);
      padLog.stick = [Math.round(vx * 100), Math.round(vy * 100)];
    };
    const track = (ev) => {
      if (ev.pointerId === stickFinger) { moveStick(ev.clientX, ev.clientY); return; }
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const hit = el && el.closest('#pad .k, #pad .dp');
      held.set(ev.pointerId, !hit ? new Set() : hit.classList.contains('dp') ? dpadAt(hit, ev.clientX, ev.clientY) : new Set([Number(hit.dataset.i)]));
      refresh();
    };
    pad.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      if (stick && stickFinger === null && ev.target.closest && ev.target.closest('.st')) { stickFinger = ev.pointerId; moveStick(ev.clientX, ev.clientY); return; }
      track(ev);
    });
    pad.addEventListener('pointermove', (ev) => { if (ev.pointerId === stickFinger || held.has(ev.pointerId)) { ev.preventDefault(); track(ev); } });
    const lift = (ev) => {
      if (ev.pointerId === stickFinger) {
        stickFinger = null;
        stick.firstElementChild.style.transform = '';
        for (const i of [16, 17, 18, 19]) send(i, 0);
        padLog.stick = [0, 0];
      }
      held.delete(ev.pointerId);
      refresh();
    };
    pad.addEventListener('pointerup', lift);
    pad.addEventListener('pointercancel', lift);
    pad.addEventListener('contextmenu', (ev) => ev.preventDefault());
  }

  // A connected controller (Bluetooth or cable) is read by EmulatorJS itself; the touch pad then only takes
  // room, so it steps aside and comes back when the controller goes away.
  const controller = () => { try { return Array.from(navigator.getGamepads()).find((p) => p && p.connected) || null; } catch { return null; } };
  const padForController = () => {
    if (!layout || !touchDevice) return;
    const on = !controller();
    $('stage').classList.toggle('pad-on', on);
    pad.hidden = !on;
  };
  window.addEventListener('gamepadconnected', padForController);
  window.addEventListener('gamepaddisconnected', padForController);
  padForController();

  // Diagnostics: what the engine is doing right now, to read or to screenshot.
  let infoTimer = 0, lastFrame = null, lastAt = 0;
  const frameNow = () => { try { return window.EJS_emulator.gameManager.getFrameNum(); } catch { return null; } };
  const drawInfo = () => {
    const frame = frameNow(), now = performance.now();
    const fps = lastFrame != null && frame != null ? Math.round((frame - lastFrame) * 1000 / (now - lastAt)) : null;
    lastFrame = frame; lastAt = now;
    const c = controller();
    let gl = '';
    try { const cv = document.querySelector('#game canvas'); gl = cv ? `lienzo ${cv.width}x${cv.height}` : 'sin lienzo'; } catch {}
    $('info').textContent = [
      `v${BUILD} · ${meta.system} · ${Math.round(blob.size / 1048576)} MB`,
      `motor: ${(run && run.info.core) || engine}${run && run.info.mem ? ` · memoria ${run.info.mem} MB` : ''}${run && run.info.config ? ` · config ${run.info.config}` : ''}${run && run.info.ejs ? ` · EmulatorJS ${run.info.ejs}` : ''}`,
      lazy ? `por partes (${lazyStats.via}): ${lazyStats.waited || 0} trozos con espera, ${lazyStats.ready || 0} ya listos` : 'juego cargado entero',
      meta.system === 'PSP' ? `God of War a 30 cuadros: ${lazyStats.gow30 ? 'sí' : 'no'} · registro del motor ${run ? run.info.log0 : ''}` : '',
      `cuadros: ${frame == null ? '—' : frame}${fps == null ? '' : ` (${fps} por segundo)`} · ${gl}`,
      (() => { const p = perfSample(); return p ? `rendimiento: ${p.turns} vueltas/s · ${p.ms} ms por vuelta (máx ${p.max}) · ocupado ${p.busy} % · sonido ${p.speed} % de la velocidad real` : 'rendimiento: midiendo'; })(),
      `audio: ${audioContexts.length ? audioContexts.map((a) => a.state).join(', ') : 'sin iniciar'}`,
      `mando: ${c ? c.id.slice(0, 40) : 'ninguno'}`,
      `pasos: ${run ? run.steps.join(' › ') : ''}`,
      'registro del motor:',
      ...logTail.slice(-8).map((l) => '  ' + l),
    ].join('\n');
  };
  const showInfo = (on) => {
    $('info').hidden = !on;
    clearInterval(infoTimer);
    if (on) { drawInfo(); infoTimer = setInterval(drawInfo, 1000); }
  };
  $('infoBtn').addEventListener('click', () => showInfo($('info').hidden));
  $('menuBtn').addEventListener('click', () => { try { window.EJS_emulator.menu.toggle(); } catch {} });
  if (engines) {
    const other = Object.keys(engines).find((key) => key !== engine);
    const eb = $('engineBtn');
    const label = `Motor: ${engines[engine]}`;
    eb.textContent = label;
    eb.hidden = false;
    let armed = 0;
    eb.addEventListener('click', () => { // two taps: switching restarts the game
      if (Date.now() - armed < 4000) { try { localStorage.setItem(engineKey, other); } catch {} leaveClean(); location.reload(); return; }
      armed = Date.now();
      eb.textContent = `¿Cambiar a ${engines[other]}? Toca otra vez`;
      setTimeout(() => { if (Date.now() - armed >= 3900) eb.textContent = label; }, 4000);
    });
  }
  if (meta.system === 'PSP') {
    // Same idea for PSP's two engines: the new one draws with the GPU, the previous one by software.
    const eb = $('engineBtn');
    const previous = PSP_CONFIGS.findIndex((c) => c.old);
    const label = `Motor: ${newEngine ? 'nuevo' : 'anterior'}`;
    eb.textContent = label;
    eb.hidden = false;
    let armed = 0;
    eb.addEventListener('click', () => {
      if (Date.now() - armed < 4000) { try { localStorage.setItem(configKey, String(newEngine ? previous : 0)); } catch {} leaveClean(); location.reload(); return; }
      armed = Date.now();
      eb.textContent = `¿Cambiar al motor ${newEngine ? 'anterior' : 'nuevo'}? Toca otra vez`;
      setTimeout(() => { if (Date.now() - armed >= 3900) eb.textContent = label; }, 4000);
    });
  }
  window.EJS_onGameStart = () => {
    // If the swap did not happen the engine is holding the stand-in, not the game: say so instead of a black screen.
    if (lazy && !lazyStats.mounted) { fail('No se pudo conectar el juego con el motor para leerlo por partes. Cierra y abre la app e inténtalo de nuevo.'); return; }
    step('juego en marcha');
    let beats = 0;
    setTimeout(() => { logOn = false; }, 15000); // after that the log is no longer about starting up
    const hint = setInterval(() => { $('soundHint').hidden = !silent(); }, 400);
    setTimeout(() => { clearInterval(hint); $('soundHint').hidden = true; }, 60000);
    $('menuBtn').hidden = false;
    $('infoBtn').hidden = false;
    // An engine that started but draws nothing new is the "black screen" case: open the panel by itself.
    const f0 = frameNow();
    setTimeout(() => { const f1 = frameNow(); if (f0 != null && f1 != null && f1 - f0 < 3 && !crashed) { step('el motor no avanza'); showInfo(true); } }, 9000);
    setInterval(() => { // heartbeat: a page that dies while playing is told apart from one closed on purpose
      if (!run || document.hidden) return;
      run.alive = Date.now();
      try { run.info.frames = window.EJS_emulator.gameManager.getFrameNum(); } catch {}
      if ($('info').hidden) { const p = perfSample(); if (p) run.info.perf = `${p.turns}/s ${p.ms}ms máx${p.max} ocupado${p.busy}% sonido${p.speed}%`; }
      saveRun();
      if (!crashed && ++beats === 30) { try { localStorage.removeItem(logKey); } catch {} } // a minute and a half of play: it works
    }, 3000);
  };
  step('cargando el emulador');
  $('home').hidden = true;
  $('stage').hidden = false;
  $('closeGame').hidden = false;
  if (newEngine) {
    // (an absolute address: this loader resolves a relative one against its own folder, not the page's)
    window.EJS_pathtodata = new URL('psp/ejs43/', location.href).href;
    window.EJS_DEBUG_XX = false; // its minified build; the detailed log is asked for separately when needed
    window.EJS_language = 'es';
    // This EmulatorJS asks for PSP's support files at a fixed address, "data/cores/..." next to the page, and
    // looks at its own CDN for updates. Here the files live in psp/ejs43/, and nothing is fetched from outside.
    const realFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      try {
        const address = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)data\/cores\/ppsspp-assets\.zip(\?|$)/.test(address)) return realFetch(new URL('psp/ejs43/cores/ppsspp-assets.zip', location.href).href, init);
        if (/^https?:\/\/cdn\.emulatorjs\.org\//.test(address)) return Promise.resolve(new Response('', { status: 404 }));
      } catch {}
      return realFetch(input, init);
    };
  }
  const s = document.createElement('script');
  s.src = newEngine ? 'psp/ejs43/loader.js' : 'psp/ejs/loader.js';
  document.body.append(s);
})();
</script>
<script>
// No page zoom. A double tap or a pinch while playing must never zoom the page: with the pad taking every
// touch there would be no way to zoom back out. If the page still ends up zoomed, it is reset.
(() => {
  document.documentElement.style.touchAction = 'manipulation'; // turns off double-tap zoom
  const meta = document.querySelector('meta[name="viewport"]');
  const locked = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  if (meta) meta.content = locked;
  for (const type of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(type, (e) => e.preventDefault(), { passive: false }); // pinch (Safari)
  document.addEventListener('dblclick', (e) => { if (!e.target.closest('input, textarea, select')) e.preventDefault(); }, { passive: false });
  const vv = window.visualViewport;
  if (vv && meta) vv.addEventListener('resize', () => {
    if (vv.scale <= 1.01) return;
    meta.content = locked + ',minimum-scale=1'; // writing the tag again makes the browser go back to scale 1
    requestAnimationFrame(() => { meta.content = locked; });
  });
})();
</script>
</body>
</html>
